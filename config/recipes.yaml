# 세척 레시피와 임계값 (웹 설정 화면에서 저장하면 이 파일이 다시 써집니다)
# recipes: 선별 결과(오염/비오염)별 세척 레시피. expected_decay_pct_per_min = 세척 중 약품 농도가 분당 줄어드는 기대 속도(%p/분)
# bin_threshold: 선별 저장함에 병이 이만큼 모이면 세척 배치 1개로 자동으로 묶는다 (병 수)
# safety: 안전 한계 (장치 코드 device/controller.py 와 같은 값이어야 함)
recipes:
  contaminated:
    name: 오염
    concentration_pct: 2.5
    temp_c: 80.0
    wash_time_min: 20.0
    expected_decay_pct_per_min: 0.15
  clean:
    name: 비오염
    concentration_pct: 1.0
    temp_c: 65.0
    wash_time_min: 10.0
    expected_decay_pct_per_min: 0.04
bin_threshold:
  contaminated: 100
  clean: 100
tolerance:
  concentration_pct: 0.2
  temp_c: 2.0
turbidity_limit_ntu: 50.0
decay_alert_factor: 1.5
safety:
  concentration_pct:
  - 0.5
  - 3.0
  temp_c:
  - 40
  - 85
  wash_time_min:
  - 5
  - 30
